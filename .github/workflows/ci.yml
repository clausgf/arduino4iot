name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-native:
    name: Native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: pio-native-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Run native unit tests
        run: pio test -e native
      - name: Run native unit tests under AddressSanitizer and UBSan
        run: pio test -e native_asan
      - name: Check that the core headers compile without Arduino
        run: python scripts/check_architecture.py headers

  build-example:
    name: Build example (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [esp32dev, esp32-s3-devkitc-1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: pio-${{ matrix.board }}-${{ runner.os }}-${{ hashFiles('library.json') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build example
        # pioarduino platform provides current arduino-esp32 3.x for PlatformIO
        run: >
          pio ci
          --lib="."
          --board=${{ matrix.board }}
          --project-option="platform=https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip"
          --project-option="framework=arduino"
          --project-option="lib_deps=bblanchon/ArduinoJson@^7.0.0"
          --keep-build-dir --build-dir=build-main
          examples/main.cpp
      - name: Check that the optional adapters are not linked
        run: >
          python scripts/check_architecture.py symbols
          build-main/.pio/build/${{ matrix.board }}/firmware.elf
          --absent IotAp,IotNtpClock,IotAdcBattery,IotCallbackBattery,IotEspHttp
          --present IotIdfHttp,IotApi

      - name: Build AP provisioning example
        # separate sketch on purpose: IotAp is opt-in via
        # iot.setNoCredentialsHandler() and is only linked when an application
        # references it, so this is the build that keeps that path compiling
        run: >
          pio ci
          --lib="."
          --board=${{ matrix.board }}
          --project-option="platform=https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip"
          --project-option="framework=arduino"
          --project-option="lib_deps=bblanchon/ArduinoJson@^7.0.0"
          --keep-build-dir --build-dir=build-ap
          examples/ap_provisioning/main.cpp
      - name: Check that the AP example does link the optional adapters
        run: >
          python scripts/check_architecture.py symbols
          build-ap/.pio/build/${{ matrix.board }}/firmware.elf
          --present IotAp,IotNtpClock,IotAdcBattery,IotIdfHttp
      - name: Report the firmware sizes
        run: |
          python scripts/check_architecture.py size build-main/.pio/build/${{ matrix.board }}/firmware.elf --label "${{ matrix.board }}, minimal example"
          python scripts/check_architecture.py size build-ap/.pio/build/${{ matrix.board }}/firmware.elf --label "${{ matrix.board }}, AP provisioning example"
