; -----------------------------------------------------------------------------
; arduino4iot - build-time secrets / seeding template
;
; Copy this file to "secrets.ini" (which you keep OUT of version control, e.g.
; via .gitignore) and fill in your deployment-specific values. These end up in
; the firmware binary, so a firmware built WITH them is sensitive - flash it once
; to seed the device. Public/CI builds omit this file and produce a secretless
; update image that reuses the values already in the device's NVS.
;
; Wire it into your project's platformio.ini:
;
;   [platformio]
;   extra_configs = secrets.ini
;
;   [env:esp32dev]                 ; public / CI build - NO secrets
;   platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
;   board = esp32dev
;   framework = arduino
;   lib_deps = https://github.com/clausgf/arduino4iot
;   ; IOT_BOARD_ID identifies the hardware variant (reported in telemetry via
;   ; iot.getBoardId()); it isn't a secret, so it stays here per env rather
;   ; than in secrets.ini.
;   build_flags = -DCORE_DEBUG_LEVEL=2 -std=gnu++20 -DIOT_BOARD_ID='"waveshare_esp32_driver"'
;
;   [env:initial]                  ; local build to flash once, WITH secrets
;   extends = env:esp32dev
;   build_flags =
;     ${env:esp32dev.build_flags}
;     ${secrets.seed_flags}
;
; Then: build/flash "env:initial" once to seed NVS; build "env:esp32dev" for the
; secretless OTA update image.
; -----------------------------------------------------------------------------

[secrets]
seed_flags =
  -DIOT_WIFI_SSID='"my-wifi"'
  -DIOT_WIFI_PASSWORD='"my-wifi-password"'
  -DIOT_API_URL='"http://192.168.178.20:8000/api"'
  -DIOT_PROJECT='"my-project"'
  -DIOT_PROVISIONING_TOKEN='"P-102-FX61O...=="'
  ; Bump this integer to force re-seeding changed values with a new firmware.
  -DIOT_SEED_GENERATION=1
  ; For an https:// API URL, seed a CA certificate in the sketch instead
  ; (tlsMode CaPin + caCertPem); a PEM is awkward to pass as a -D define.
