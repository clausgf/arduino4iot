; Development and CI configuration for the arduino4iot library itself.
; Library users do not need this file - add the library to lib_deps
; of your own project instead (see README.md).

[platformio]
default_envs = native

; Native environment for unit tests (pio test -e native)
[env:native]
platform = native
test_framework = unity
; every service implementation, so tests can link against them. The list
; excludes the Arduino/ESP-IDF sources, so a new source that names Arduino
; breaks this build until it is either made Arduino-free or excluded here.
test_build_src = yes
build_src_filter =
    +<*>
    -<iot.cpp>
    -<iot_ap.cpp>
    -<iot_endpoints.cpp>
    -<iot_esp_ports.cpp>
    -<iot_idf_http.cpp>
    -<iot_logger.cpp>
    -<iot_ota_internal.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -std=gnu++20
    -I include
    -I src
