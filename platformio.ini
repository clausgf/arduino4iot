; Development and CI configuration for the arduino4iot library itself.
; Library users do not need this file - add the library to lib_deps
; of your own project instead (see README.md).

[platformio]
default_envs = native

; Native environment for unit tests (pio test -e native)
[env:native]
platform = native
test_framework = unity
; the on-device suites belong to [env:device]
test_ignore = device/*
; every service implementation, so tests can link against them. The list
; excludes the Arduino/ESP-IDF sources, so a new source that names Arduino
; breaks this build until it is either made Arduino-free or excluded here.
test_build_src = yes
build_src_filter =
    +<*>
    -<iot.cpp>
    -<iot_ap.cpp>
    -<iot_endpoints.cpp>
    -<iot_esp_ports.cpp>
    -<iot_idf_http.cpp>
    -<iot_ota_internal.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -std=gnu++20
    -I include
    -I src

; The native tests again, under AddressSanitizer and UndefinedBehaviorSanitizer
; (pio test -e native_asan; CI runs it too): an out-of-bounds access or
; undefined behavior aborts the test instead of passing unnoticed.
[env:native_asan]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -fsanitize=address,undefined
    -fno-sanitize-recover=all
    -fno-omit-frame-pointer
    -g

; On-device tests (pio test -e device), run by hand against a devkit on USB -
; never in CI, which only runs the native env. An ESP32 DevKit v1 (esp32dev);
; the device reaches a test server on this host over WiFi, started by
; test/device/test_custom_runner.py. WiFi credentials come from the device's
; NVS (a provisioned device) or DEVICE_TEST_WIFI_SSID/_PASSWORD. See
; docs/device_tests.md.
[env:device]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
framework = arduino
board = esp32dev
; the Unity runner plus the host-side test server
test_framework = custom
test_filter = device/*
test_build_src = yes
test_speed = 115200
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -I include
    -I src
    -DCORE_DEBUG_LEVEL=3
